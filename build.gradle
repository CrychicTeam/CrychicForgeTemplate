plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.80'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

repositories {
    maven {
        name "neoforgedReleases"
        url "https://maven.neoforged.net/releases"
    }
    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.org"
    }
    mavenLocal()
}

apply plugin: 'idea'
apply plugin: 'maven-publish'

ext.configFile = file("build.txt")
configFile.withReader {
    def prop = new Properties()
    prop.load(it)
    project.ext.config = new ConfigSlurper().parse(prop)
    project.ext.hasConfig = { key ->
        return config.isSet(key);
    }
}
version = config.mod_version
group = config.maven_group
base {
    archivesName = "${config.archive_name}-${config.mc_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

neoForge {
    version = "${config.mc_version}.${config.neoforge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', config.mod_id
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            programArgument '--mixin'
            programArgument "mixins.${config.mod_id}.json"
            programArgument '-Dmixin.env.disableRefMap=true'

            if (hasConfig("mc_user") && !config.mc_user.isEmpty()) {
                def userId = config.mc_user.split(',', 2)
                programArgument "--username"
                programArgument userId[0]

                programArgument "--uuid"
                if (userId.length > 1)
                    programArgument userId[1]
                else
                    programArgument "00000000000000000000000000000001" // this is a default
            }
        }

        server {
            server()
            // Set working directory
            gameDirectory = project.file('run/server')

            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', config.mod_id

            // Mixin configuration
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // Add program arguments
            programArgument '--mixin'
            programArgument "mixins.${config.mod_id}.json"
        }

        gameTestServer {
            type = "gameTestServer"
            // Set working directory
            gameDirectory = project.file('run/server')

            systemProperty 'neoforge.enabledGameTestNamespaces', config.mod_id

            // Mixin configuration
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // Add program arguments
            programArgument '--mixin'
            programArgument "mixins.${config.mod_id}.json"
        }

        data {
            data()
            // Set working directory
            gameDirectory = project.file('run/data')

            systemProperty 'neoforge.enabledGameTestNamespaces', config.mod_id

            // Mixin configuration
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // Add program arguments
            programArgument '--mod'
            programArgument config.mod_id
            programArgument '--all'
            programArgument '--output'
            programArgument file('src/generated/resources/').absolutePath
            programArgument '--existing'
            programArgument file('src/main/resources/').absolutePath
            programArgument '--mixin'
            programArgument "mixins.${config.mod_id}.json"
        }

        // Applied to all run configurations
        configureEach {
            // Recommended logging data for a userdev environment
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${config.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

