dependencies {
    // Note: Dependencies now use NeoForge's dependency mechanism

    // Mixin extras
    if (hasConfig("mixin_extras_version") && !config.mixin_extras_version.isEmpty()) {
//        implementation "com.github.llamalad7.mixinextras:mixinextras-neoforge:${config.mixin_extras_version}"
//        annotationProcessor "com.github.llamalad7.mixinextras:mixinextras-common:${config.mixin_extras_version}"
    }

    // Registrate
    if (hasConfig("registrate_version") && !config.registrate_version.isEmpty()) {
        implementation "com.tterrag.registrate:Registrate:${config.registrate_version}"
    }

    // JEI
    if (hasConfig("jei_version") && !config.jei_version.isEmpty()) {
        compileOnly "mezz.jei:jei-${config.jei_mc_version}-common-api:${config.jei_version}"
        compileOnly "mezz.jei:jei-${config.jei_mc_version}-neoforge-api:${config.jei_version}"
        localRuntime "mezz.jei:jei-${config.jei_mc_version}-neoforge:${config.jei_version}"
    }

    // GeckoLib
    if (hasConfig("geckolib_version") && !config.geckolib_version.isEmpty()) {
        implementation "software.bernie.geckolib:geckolib-neoforge-${config.mc_version}:${config.geckolib_version}"
        implementation "com.eliotlash.mclib:mclib:20"
    }

    // Curios
    if (hasConfig("curios_version") && !config.curios_version.isEmpty()) {
        compileOnly "top.theillusivec4.curios:curios-neoforge:${config.curios_version}"
        localRuntime "top.theillusivec4.curios:curios-neoforge:${config.curios_version}"
    }

    // Player Animator
    if (hasConfig("playeranimator_version") && !config.playeranimator_version.isEmpty()) {
        implementation "dev.kosmx.player-anim:player-animation-lib-neoforge:${config.playeranimator_version}"
        localRuntime "io.github.kosmx.bendy-lib:bendy-lib-neoforge:${config.bendylib_version}"
    }

    // Mixin annotation processor
    if (hasConfig("enable_annotation") && Boolean.parseBoolean(config.enable_annotation)) {
        annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
    }

    // L2 Library
    if (hasConfig("l2_library_version") && !config.l2_library_version.isEmpty()) {
        implementation "dev.xkmc.l2library:l2library:${config.l2_library_version}"
    }

    // L2 Damage Tracker
    if (hasConfig("l2damagetracker_version") && !config.l2damagetracker_version.isEmpty()) {
        implementation "dev.xkmc.l2damagetracker:l2damagetracker:${config.l2damagetracker_version}"
    }

    // L2 Serial
    if (hasConfig("l2serial_version") && !config.l2serial_version.isEmpty()) {
        implementation "dev.xkmc.l2serial:l2serial:${config.l2serial_version}"
    }

    // PIBrary
    if (hasConfig("pibrary_version") && !config.pibrary_version.isEmpty()) {
        implementation "com.mihono.pickaid:pibrary:${config.pibrary_version}"
    }

    // RPG Projects
    if (hasConfig("rpg_projects") && !config.rpg_projects.isEmpty()) {
        // attribute fix
        localRuntime "curse.maven:attributefix-280510:4648448"
        // max health fix
        localRuntime "curse.maven:max-health-fix-492246:4648479"
        // dummy target
        localRuntime "curse.maven:mmmmmmmmmmmm-225738:4602101"
        localRuntime "curse.maven:selene-499980:4656567"
        // apple skin
        compileOnly "curse.maven:appleskin-248787:4605078"
        localRuntime "curse.maven:appleskin-248787:4605078"
    }

    // Reference Projects
    if (hasConfig("reference_projects") && !config.reference_projects.isEmpty()) {
        compileOnly "curse.maven:forgeendertech-244844:6030567"
        compileOnly "curse.maven:advanced-hook-launchers-244849:5829843"
    }

    // KubeJS Integration
    if (hasConfig("kubejs_version") && !config.kubejs_version.isEmpty()) {
        compileOnly "dev.latvian.mods:kubejs-neoforge:${config.kubejs_version}"
        compileOnly "dev.latvian.mods:rhino-neoforge:${config.rhino_version}"
        implementation "dev.architectury:architectury-neoforge:${config.architectury_version}"
    }

    // Dynamic libraries
    def libraries = new File(file("libraries"), "${config.mc_version}")
    if (!libraries.isDirectory()) libraries.mkdirs()

    // All libraries
    def libDir = new File(libraries, "all");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            implementation project.dependencies.create("_all:$modartifact:$modversion") {
                transitive = false
            }
        }
    } else libDir.mkdir();

    // Classpath-only libraries
    libDir = new File(libraries, "classpathOnly");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            compileOnly project.dependencies.create("_classpath:$modartifact:$modversion") {
                transitive = false
            }
        }
    } else libDir.mkdir();

    // Runtime-only libraries
    libDir = new File(libraries, "runtimeOnly");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            localRuntime project.dependencies.create("_runtime:$modartifact:$modversion") {
                transitive = false
            }
        }
    } else libDir.mkdir();

    // Embedded libraries
    libDir = new File(file("libraries"), "embedded");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            def modreference = "lib:$modartifact:$modversion"
            implementation project.dependencies.create(modreference) {
                transitive = false
            }
        }
    } else libDir.mkdir();
}

// Replace properties in resources
def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
        minecraft_version: config.mc_version,
        minecraft_version_range: config.mc_range,
        neo_version: "${config.mc_version}-${config.neoforge_version}",
        neo_version_range: config.forge_range,
        loader_version_range: "[1.0.0,)",
        mod_id: config.mod_id,
        mod_name: config.mod_name,
        mod_license: config.mod_license,
        mod_version: config.mod_version,
        mod_authors: config.mod_authors,
        mod_description: config.mod_description,
        modrinth_project: config.modrinth_project,
        issue_tracker_url: config.issue_tracker_url,
        mod_credits: config.mod_credits
]

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Process resources and include generated metadata
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : config.mod_id,
                "Specification-Vendor"    : config.mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : archiveVersion,
                "Implementation-Vendor"   : config.mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "mixins.${config.mod_id}.json"
        ])
    }
    archiveClassifier.set('slim')
}

task deobfJar(type: Jar) {
    archiveClassifier = 'deobf'
    from sourceSets.main.output
    manifest {
        attributes([
                "Specification-Title"     : config.mod_id,
                "Specification-Vendor"    : config.mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : archiveVersion,
                "Implementation-Vendor"   : config.mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "mixins.${config.mod_id}.json"
        ])
    }
}

task srcJar(type: Jar, dependsOn: classes) {
    from sourceSets.main.allJava
    archiveClassifier = 'sources'
}

artifacts {
    archives deobfJar
    archives srcJar
}

// Modrinth publishing configuration
if (hasConfig("modrinth_project") && !config.modrinth_project.isEmpty()) {
    modrinth {
        token = System.env.MODRINTH_TOKEN != null ? System.env.MODRINTH_TOKEN : "NONE"
        projectId = config.modrinth_project
        versionNumber = config.mod_version
        versionType = config.release_type
        uploadFile = jar
        gameVersions = [config.mc_version]
        loaders = ['NeoForge']

        dependencies {
            def mods = config.required_mods.split(";")
            if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
                for (final def one in mods) {
                    if (one.isBlank()) continue
                    if (one.startsWith("@")) {
                        def pars = one.substring(1).split(":", 2)
                        if (pars[0].equalsIgnoreCase("m")) {
                            required.project pars[1].trim()
                        }
                    } else
                        required.project one.trim()
                }

            mods = config.optional_mods.split(";")
            if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
                for (final def one in mods) {
                    if (one.isBlank()) continue
                    if (one.startsWith("@")) {
                        def pars = one.substring(1).split(":", 2)
                        if (pars[0].equalsIgnoreCase("m")) {
                            optional.project pars[1].trim()
                        }
                    } else
                        optional.project one.trim()
                }

            mods = config.incompatible_mods.split(";")
            if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
                for (final def one in mods) {
                    if (one.isBlank()) continue
                    if (one.startsWith("@")) {
                        def pars = one.substring(1).split(":", 2)
                        if (pars[0].equalsIgnoreCase("m")) {
                            incompatible.project pars[1].trim()
                        }
                    } else
                        incompatible.project one.trim()
                }

            mods = config.embedded_mods.split(";")
            if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
                for (final def one in mods) {
                    if (one.isBlank()) continue
                    if (one.startsWith("@")) {
                        def pars = one.substring(1).split(":", 2)
                        if (pars[0].equalsIgnoreCase("m")) {
                            embedded.project pars[1].trim()
                        }
                    } else
                        embedded.project one.trim()
                }
        }
    }
}

// CurseForge publishing configuration
if (hasConfig("cf_project") && !config.cf_project.isEmpty()) {
    curseforge {
        apiKey = System.env.CURSEFORGE_TOKEN != null ? System.env.CURSEFORGE_TOKEN : "NONE"
        project {
            id = config.cf_project
            changelogType = 'html'
            changelog = ""
            releaseType = config.release_type
            addGameVersion config.mc_version
            addGameVersion "NeoForge"
            mainArtifact(jar) {
                displayName = "[${config.mc_version}] ${config.mod_name} - ${config.mod_version}"
            }

            def reqDeps = new ArrayList()
            def optDeps = new ArrayList()
            def incompat = new ArrayList()
            def embLibs = new ArrayList()

            def mods = config.required_mods.split(";")
            if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
                for (final def one in mods) {
                    if (one.isBlank()) continue
                    if (one.startsWith("@")) {
                        def pars = one.substring(1).split(":", 2)
                        if (pars[0].equalsIgnoreCase("c")) {
                            reqDeps.add pars[1].trim()
                        }
                    } else
                        reqDeps.add one.trim()
                }

            mods = config.optional_mods.split(";")
            if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
                for (final def one in mods) {
                    if (one.isBlank()) continue
                    if (one.startsWith("@")) {
                        def pars = one.substring(1).split(":", 2)
                        if (pars[0].equalsIgnoreCase("c")) {
                            optDeps.add pars[1].trim()
                        }
                    } else
                        optDeps.add one.trim()
                }

            mods = config.incompatible_mods.split(";")
            if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
                for (final def one in mods) {
                    if (one.isBlank()) continue
                    if (one.startsWith("@")) {
                        def pars = one.substring(1).split(":", 2)
                        if (pars[0].equalsIgnoreCase("c")) {
                            incompat.add pars[1].trim()
                        }
                    } else
                        incompat.add one.trim()
                }

            mods = config.embedded_mods.split(";")
            if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
                for (final def one in mods) {
                    if (one.isBlank()) continue
                    if (one.startsWith("@")) {
                        def pars = one.substring(1).split(":", 2)
                        if (pars[0].equalsIgnoreCase("c")) {
                            embLibs.add pars[1].trim()
                        }
                    } else
                        embLibs.add one.trim()
                }

            if (reqDeps.size() > 0 || optDeps.size() > 0 || incompat.size() > 0 || embLibs.size() > 0) {
                relations {
                    reqDeps.each { dep ->
                        requiredDependency dep
                    }
                    optDeps.each { dep ->
                        optionalDependency dep
                    }
                    incompat.each { dep ->
                        incompatible dep
                    }
                    embLibs.each { dep ->
                        embeddedLibrary dep
                    }
                }
            }
        }
    }
}

// Define artifact for publishing
def reobfFile = jar.archiveFile.get().asFile
def reobfArtifact = artifacts.add('default', reobfFile) {
    type 'jar'
}

// Task to build and upload the mod
tasks.register('buildAndUploadMod') {
    group = "upload"

    // Only add dependencies if the projects are configured
    if (hasConfig("cf_project") && !config.cf_project.isEmpty()) {
        dependsOn "curseforge${config.cf_project}"
    }

    if (hasConfig("modrinth_project") && !config.modrinth_project.isEmpty()) {
        dependsOn 'modrinth'
    }

    doLast {
        println "Upload complete."
    }
}

// Configure publishing after evaluation
afterEvaluate {
    if (hasConfig("maven_url") && !config.maven_url.isEmpty()) {
        if (hasConfig("cf_project") && !config.cf_project.isEmpty()) {
            tasks["curseforge${config.cf_project}"].dependsOn.add(publish)
        }

        if (hasConfig("modrinth_project") && !config.modrinth_project.isEmpty()) {
            tasks["modrinth"].dependsOn.add(publish)
        }
    }
}

// Maven publishing configuration
publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = config.maven_group
            artifactId = config.archive_name
            version = config.mc_version.replace('.', '') + "-" + config.mod_version

            artifact(reobfArtifact) {
                classifier = config.mod_version
            }

            artifact(srcJar) {
                classifier = config.mod_version + '-sources'
            }

            artifact(deobfJar) {
                classifier = config.mod_version + '-deobf'
            }

            pom.withXml {
                def dependenciesNode = asNode().appendNode('dependencies')
            }
        }
    }

    repositories {
        if (hasConfig("maven_url") && !config.maven_url.isEmpty()) {
            maven {
                url config.maven_url
                if (hasConfig("maven_user") && !config.maven_user.isEmpty()) {
                    credentials {
                        username = config.maven_user
                        password = config.maven_passwd
                    }
                }
            }
        } else {
            // Default repository if not specified in config
            maven {
                url "file://${project.projectDir}/repo"
            }
        }
    }
}

// Version increment utility
import java.nio.file.Files

def incrementBuild = {
    if (hasConfig("formal_version") && Boolean.parseBoolean(config.formal_version)) {
        def buildTxt = configFile.toPath()
        List<String> lines = Files.readAllLines buildTxt
        lines.replaceAll { String ln ->
            if (ln.startsWith("mod_version")) {
                def version = ln.split("=")[1]
                def dot = version.lastIndexOf('.') + 1
                def newVersion = version.substring(0, dot)
                def lastOne = Integer.parseInt(version.substring(dot)) + 1
                return "mod_version=" + newVersion + lastOne
            }
            return ln
        }
        Files.write buildTxt, lines, java.nio.file.StandardOpenOption.CREATE
    }
}

tasks.register("incrementBuildVersionProperty") {
    group "upload"
    doLast incrementBuild
}

// Add the version increment task to build dependencies
tasks.build.dependsOn tasks.incrementBuildVersionProperty

// Make sure UTF-8 is used for all Java compilation
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA configuration for better IDE experience
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}