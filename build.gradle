buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url "https://plugins.gradle.org/m2/" }
        mavenCentral()
        maven {
            name = 'sponge'
            url = 'https://repo.spongepowered.org/maven'
        }
    }
    dependencies {
        classpath "gradle.plugin.com.matthewprenger:CurseGradle:1.4.+"
        classpath 'org.spongepowered:mixingradle:0.7.+'
        classpath "org.tomlj:tomlj:1.1.1"
    }
}


plugins {
    id "com.modrinth.minotaur" version "2.+"
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'idea'
apply plugin: 'maven-publish'
apply plugin: "com.matthewprenger.cursegradle"
apply plugin: 'org.spongepowered.mixin'
apply from: 'gradle/template-config.gradle'

def template = project.ext.template
def templatePlatform = project.ext.templatePlatform
def enabledFeatures = project.ext.enabledFeatures
def resolvedFeatureVersions = project.ext.resolvedFeatureVersions
def templateAuthors = template.authors.join(", ")
def renderedArchiveStem = template.renderedArchiveStem

jarJar.enable()

// Publish the development jar as the default Maven artifact and keep jarJar for runtime distribution.
tasks.jarJar.configure {
    it.archiveClassifier.set("runtime")
    it.archiveFileName.set("${renderedArchiveStem}-runtime.jar")
    finalizedBy("reobfJarJar")
}

tasks.named("jar", Jar).configure {
    archiveFileName.set("${renderedArchiveStem}.jar")
}

tasks.jar.configure {
    it.archiveClassifier.set("")
}

tasks.matching { it.name == "reobfJar" }.configureEach {
    enabled = false
}

version = template.finalVersion
group = template.group
base {
    archivesName = template.archiveName
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(templatePlatform.javaVersion))

mixin {
    add sourceSets.main, "${template.modId}.refmap.json"
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', template.modId
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            def args = new ArrayList()

            args.add "--mixin"
            args.add "mixins.${template.modId}.json"

            args.add "-Dmixin.env.disableRefMap=true"

            if (hasConfig("mc_user") && !config.mc_user.isEmpty()) {
                def userId = config.mc_user.split(',', 2)
                args.add "--username"
                args.add userId[0]

                args.add "--uuid"
                if (userId.length > 1) args.add userId[1]
                else args.add "00000000000000000000000000000001" // this is a default
            }

            setArgs(args)
            mods {
                "${template.modId}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', template.modId
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            def args = new ArrayList()
            args.add "--mixin"
            args.add "mixins.${template.modId}.json"
            setArgs(args)
            mods {
                "${template.modId}" {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run/server')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', template.modId
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            def args = new ArrayList()
            args.add "--mixin"
            args.add "mixins.${template.modId}.json"
            setArgs(args)
            mods {
                "${template.modId}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run/data')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', template.modId
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            def args = new ArrayList()
            args.add "--mod"
            args.add template.modId
            args.add "--all"
            args.add "--output"
            args.add file('src/generated/resources/').absolutePath
            args.add "--existing"
            args.add file('src/main/resources/').absolutePath

            args.add "--mixin"
            args.add "mixins.${template.modId}.json"

            setArgs(args)

            mods {
                "${template.modId}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroupByRegex "mezz\\.jei.*"
        }
    }
    maven {
        name = 'tterrag'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }
    maven {
        name = "Curseforge"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        // Shedaniel's maven (Architectury API)
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        name = "Lat's Maven"
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        name = "Mihono's maven"
        url = "https://maven.mihono.cn/repository/pickaid1201/"
    }
    flatDir { dirs "libraries/${templatePlatform.mcVersion}/all" }
    flatDir { dirs "libraries/${templatePlatform.mcVersion}/classpathOnly" }
    flatDir { dirs "libraries/${templatePlatform.mcVersion}/runtimeOnly" }
    flatDir { dirs "libraries/embedded" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${templatePlatform.forgeVersionWithMc}"

    if (enabledFeatures.mixin_extras) {
        compileOnly(annotationProcessor("com.github.llamalad7.mixinextras:mixinextras-common:${resolvedFeatureVersions.mixinExtras}"))
    }

    implementation fg.deobf("com.tterrag.registrate:Registrate:${resolvedFeatureVersions.registrate}")
    jarJar(group: 'com.tterrag.registrate', name: 'Registrate', version: "[MC1.20,MC1.21)")

    if (enabledFeatures.jei) {
        compileOnly fg.deobf("mezz.jei:jei-${templatePlatform.mcVersion}-common-api:${resolvedFeatureVersions.jei}")
        compileOnly fg.deobf("mezz.jei:jei-${templatePlatform.mcVersion}-forge-api:${resolvedFeatureVersions.jei}")
        runtimeOnly fg.deobf("mezz.jei:jei-${templatePlatform.mcVersion}-forge:${resolvedFeatureVersions.jei}")
    }

    if (enabledFeatures.curios) {
        compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${resolvedFeatureVersions.curios}")
    }

    if (enabledFeatures.geckolib) {
        implementation fg.deobf("software.bernie.geckolib:geckolib-neoforge-${templatePlatform.mcVersion}:${resolvedFeatureVersions.geckolib}")
        implementation("com.eliotlash.mclib:mclib:20")
        jarJar(group: 'software.bernie.geckolib', name: "geckolib-neoforge-${templatePlatform.mcVersion}", version: "[${resolvedFeatureVersions.geckolib},)")
    }

    if (enabledFeatures.player_animator) {
        implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${resolvedFeatureVersions.playerAnimator}")
        runtimeOnly fg.deobf("io.github.kosmx.bendy-lib:bendy-lib-forge:${resolvedFeatureVersions.bendylib}")
    }

    if (hasConfig("enable_annotation") && Boolean.parseBoolean(config.enable_annotation)) {
        compileOnly(annotationProcessor("org.spongepowered:mixin:0.8.7:processor"))
    }

    if (enabledFeatures.mixin_extras) {
        implementation fg.deobf("com.github.llamalad7.mixinextras:mixinextras-forge:${resolvedFeatureVersions.mixinExtras}")
        jarJar(group: 'com.github.llamalad7.mixinextras', name: 'mixinextras-forge', version: "[${resolvedFeatureVersions.mixinExtras},)")
    }

    if (hasConfig("l2_library_version") && !config.l2_library_version.isEmpty()) {
        implementation fg.deobf("dev.xkmc.l2library:l2library:${config.l2_library_version}")
        jarJar(group: 'dev.xkmc', name: 'l2library', version: "[${config.l2_library_version},)")
    }


    // Libraries jarjar.

    if (hasConfig("l2damagetracker_version") && !config.l2damagetracker_version.isEmpty()) {
        implementation fg.deobf("dev.xkmc.l2damagetracker:l2damagetracker:${config.l2damagetracker_version}")
        jarJar(group: 'dev.xkmc', name: 'l2damagetracker', version: "[${config.l2damagetracker_version},)")
    }

    if (hasConfig("l2serial_version") && !config.l2serial_version.isEmpty()) {
        implementation fg.deobf("dev.xkmc.l2serial:l2serial:${config.l2serial_version}")
        jarJar(group: 'dev.xkmc', name: 'l2serial', version: "[${config.l2serial_version},)")
    }

    if (hasConfig("pibrary_version") && !config.pibrary_version.isEmpty()) {
        implementation fg.deobf("com.mihono.pickaid:pibrary:${config.pibrary_version}")
        jarJar(group: 'com.mihono.pickaid', name: 'pibrary', version: "[${config.pibrary_version},)")
    }

    if (hasConfig("rpg_projects") && !config.rpg_projects.isEmpty()) {
        // attribute fix
        runtimeOnly fg.deobf("curse.maven:attributefix-280510:4648448")
        // max health fix
        runtimeOnly fg.deobf("curse.maven:max-health-fix-492246:4648479")
        // dummy target
        runtimeOnly fg.deobf("curse.maven:mmmmmmmmmmmm-225738:4602101")
        runtimeOnly fg.deobf("curse.maven:selene-499980:4656567")
        // apple skin
        compileOnly fg.deobf("curse.maven:appleskin-248787:4605078")
        runtimeOnly fg.deobf("curse.maven:appleskin-248787:4605078")
    }

    if (hasConfig("reference_projects") && !config.reference_projects.isEmpty()) {
        compileOnly fg.deobf("curse.maven:forgeendertech-244844:6030567")
        compileOnly fg.deobf("curse.maven:advanced-hook-launchers-244849:5829843")
    }

    if (enabledFeatures.kubejs) {
        compileOnly fg.deobf("dev.latvian.mods:kubejs-forge:${resolvedFeatureVersions.kubejs}")
        compileOnly fg.deobf("dev.latvian.mods:rhino-forge:${resolvedFeatureVersions.rhino}")
        implementation fg.deobf("dev.architectury:architectury-forge:${resolvedFeatureVersions.architectury}")
    }

    def libraries = new File(file("libraries"), "${templatePlatform.mcVersion}")
    if (!libraries.isDirectory()) libraries.mkdirs()

    def libDir = new File(libraries, "all");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            dependencies {
                implementation fg.deobf(project.dependencies.create("_all:$modartifact:$modversion") {
                    transitive = false
                })
            }
        }
    } else libDir.mkdir();

    libDir = new File(libraries, "classpathOnly");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            dependencies {
                compileOnly fg.deobf(project.dependencies.create("_classpath:$modartifact:$modversion") {
                    transitive = false
                })
            }
        }
    } else libDir.mkdir();

    libDir = new File(libraries, "runtimeOnly");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            dependencies {
                runtimeOnly fg.deobf(project.dependencies.create("_runtime:$modartifact:$modversion") {
                    transitive = false
                })
            }
        }
    } else libDir.mkdir();

    libDir = new File(file("libraries"), "embedded");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            def modreference = "lib:$modartifact:$modversion"

            dependencies {
                implementation project.dependencies.create(modreference) {
                    transitive = false
                }
            }
        }
    } else libDir.mkdir();
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
    minecraft_version      : templatePlatform.mcVersion,
    minecraft_version_range: templatePlatform.mcVersionRange,
    forge_version          : templatePlatform.forgeVersionWithMc,
    forge_version_range    : templatePlatform.forgeVersionRange,
    mod_id                 : template.modId,
    mod_name               : template.modName,
    mod_license            : template.license,
    mod_version            : template.finalVersion,
    mod_authors            : templateAuthors,
    mod_description        : template.description,
    mod_credits            : template.credits,
    issue_tracker_url      : template.issueTracker,
    modrinth_project       : template.modrinthProject,
    curios_version         : resolvedFeatureVersions.curiosVersionRange,
    geckolib_version       : resolvedFeatureVersions.geckolibVersionRange,
    playeranimator_version : resolvedFeatureVersions.playerAnimatorVersionRange,
    citadel_version        : "",
    jei_version            : resolvedFeatureVersions.jeiVersionRange
]
processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : template.modId,
                "Specification-Vendor"    : "Zeitheron",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : archiveVersion,
                "Implementation-Vendor"   : templateAuthors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "mixins.${template.modId}.json"
        ])
    }
    archiveClassifier.set('')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(Javadoc).configureEach {
    source = sourceSets.main.allJava
    classpath = sourceSets.main.compileClasspath
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('html5', true)
}

task srcJar(type: Jar, dependsOn: classes) {
    from sourceSets.main.allJava
    archiveClassifier = 'sources'
    archiveFileName.set("${renderedArchiveStem}-sources.jar")
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    from javadoc.destinationDir
    archiveClassifier = 'javadoc'
    archiveFileName.set("${renderedArchiveStem}-javadoc.jar")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact(tasks.named("srcJar"))
            artifact(tasks.named("javadocJar"))
            artifact(tasks.jarJar)
            artifactId = template.modId
        }
    }
    repositories {
        maven {
            url = System.env.MAVEN_URL != null ? System.env.MAVEN_URL : template.mavenUrl
            
            def mavenUser = System.env.MAVEN_USER != null ? System.env.MAVEN_USER : config.maven_user
            def mavenPassword = System.env.MAVEN_PASSWORD != null ? System.env.MAVEN_PASSWORD : config.maven_passwd
            
            if (mavenUser != null && !mavenUser.isEmpty()) {
                credentials {
                    username = mavenUser
                    password = mavenPassword
                }
            }
        }
    }
}

task deobfJar(type: Jar) {
    archiveClassifier = 'deobf'
    from sourceSets.main.output
    manifest {
        attributes(["Specification-Title"     : template.modId,
                    "Specification-Vendor"    : "Zeitheron",
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : archiveVersion,
                    "Implementation-Vendor"   : templateAuthors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "MixinConfigs"            : "mixins.${template.modId}.json"
        ])
    }
}

artifacts {
    archives deobfJar
    archives srcJar
    archives javadocJar
}

modrinth {
    token = System.env.MODRINTH_TOKEN != null ? System.env.MODRINTH_TOKEN : "NONE"
    projectId = template.modrinthProject
    versionNumber = template.finalVersion
    versionType = template.releaseType
    uploadFile = jarJar
    gameVersions = [templatePlatform.mcVersion]
    loaders = ['Forge']
    dependencies {
        def mods = config.required_mods.split(";")
        if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
            for (final def one in mods) {
                if (one.isBlank()) continue
                if (one.startsWith("@")) {
                    def pars = one.substring(1).split(":", 2)
                    if (pars[0].equalsIgnoreCase("m")) {
                        required.project pars[1].trim()
                    }
                } else
                    required.project one.trim()
            }

        mods = config.optional_mods.split(";")
        if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
            for (final def one in mods) {
                if (one.isBlank()) continue
                if (one.startsWith("@")) {
                    def pars = one.substring(1).split(":", 2)
                    if (pars[0].equalsIgnoreCase("m")) {
                        optional.project pars[1].trim()
                    }
                } else
                    optional.project one.trim()
            }

        mods = config.incompatible_mods.split(";")
        if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
            for (final def one in mods) {
                if (one.isBlank()) continue
                if (one.startsWith("@")) {
                    def pars = one.substring(1).split(":", 2)
                    if (pars[0].equalsIgnoreCase("m")) {
                        incompatible.project pars[1].trim()
                    }
                } else
                    incompatible.project one.trim()
            }

        mods = config.embedded_mods.split(";")
        if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
            for (final def one in mods) {
                if (one.isBlank()) continue
                if (one.startsWith("@")) {
                    def pars = one.substring(1).split(":", 2)
                    if (pars[0].equalsIgnoreCase("m")) {
                        embedded.project pars[1].trim()
                    }
                } else
                    embedded.project one.trim()
            }
    }
}

curseforge {
    apiKey = System.env.CURSEFORGE_TOKEN != null ? System.env.CURSEFORGE_TOKEN : "NONE"
    project {
        id = template.curseforgeProject.toString()
        changelogType = 'html'
        changelog = ""
        releaseType = template.releaseType
        addGameVersion templatePlatform.mcVersion
        addGameVersion "Forge"
        mainArtifact(jarJar) {
            displayName = "[${templatePlatform.mcVersion}] ${template.modName} - ${template.finalVersion}"
        }

        def reqDeps = new ArrayList()
        def optDeps = new ArrayList()
        def incompat = new ArrayList()
        def embLibs = new ArrayList()

        def mods = config.required_mods.split(";")
        if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
            for (final def one in mods) {
                if (one.isBlank()) continue
                if (one.startsWith("@")) {
                    def pars = one.substring(1).split(":", 2)
                    if (pars[0].equalsIgnoreCase("c")) {
                        reqDeps.add pars[1].trim()
                    }
                } else
                    reqDeps.add one.trim()
            }

        mods = config.optional_mods.split(";")
        if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
            for (final def one in mods) {
                if (one.isBlank()) continue
                if (one.startsWith("@")) {
                    def pars = one.substring(1).split(":", 2)
                    if (pars[0].equalsIgnoreCase("c")) {
                        optDeps.add pars[1].trim()
                    }
                } else
                    optDeps.add one.trim()
            }

        mods = config.incompatible_mods.split(";")
        if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
            for (final def one in mods) {
                if (one.isBlank()) continue
                if (one.startsWith("@")) {
                    def pars = one.substring(1).split(":", 2)
                    if (pars[0].equalsIgnoreCase("c")) {
                        incompat.add pars[1].trim()
                    }
                } else
                    incompat.add one.trim()
            }

        mods = config.embedded_mods.split(";")
        if (mods.length > 0 && (mods.length > 1 || !mods[0].isEmpty()))
            for (final def one in mods) {
                if (one.isBlank()) continue
                if (one.startsWith("@")) {
                    def pars = one.substring(1).split(":", 2)
                    if (pars[0].equalsIgnoreCase("c")) {
                        embLibs.add pars[1].trim()
                    }
                } else
                    embLibs.add one.trim()
            }

        if (reqDeps.size() > 0 || optDeps.size() > 0 || incompat.size() > 0 || embLibs.size() > 0) {
            relations {
                reqDeps.each { dep ->
                    requiredDependency dep
                }
                optDeps.each { dep ->
                    optionalDependency dep
                }
                incompat.each { dep ->
                    incompatible dep
                }
                embLibs.each { dep ->
                    embeddedLibrary dep
                }
            }
        }
    }
}

import net.minecraftforge.gradle.common.tasks.SignJar

task signJar(type: SignJar, dependsOn: jar) {
    onlyIf {
        System.env.MC_KS_PASS != null
    }
    keyStore = System.env.MC_KS_PATH
    alias = System.env.MC_KS_ALIAS
    storePass = System.env.MC_KS_PASS
    keyPass = System.env.MC_KS_PASS
    inputFile = jar.archiveFile
    outputFile = jar.archiveFile
}

def reobfFile = jar.archiveFile.get().asFile
def reobfArtifact = artifacts.add('default', reobfFile) {
    type 'jar'
    builtBy 'signJar'
}

jar.finalizedBy('reobfJar')
publish.dependsOn('reobfJarJar')

build.dependsOn signJar

tasks.register('buildAndUploadMod') {
    group = "upload"
    def curseforgeTaskName = "curseforge${template.curseforgeProject}"
    if (tasks.names.contains(curseforgeTaskName)) {
        dependsOn curseforgeTaskName
    }
    dependsOn 'modrinth'

    doLast {
        println "Upload complete."
    }
}

afterEvaluate {
    def curseforgeTaskName = "curseforge${template.curseforgeProject}"
    if (!template.mavenUrl.isEmpty()) {
        if (tasks.names.contains(curseforgeTaskName)) {
            tasks[curseforgeTaskName].dependsOn.add(publish)
        }
        tasks["modrinth"].dependsOn.add(publish)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

import java.nio.file.Files

def incrementBuild = {
    if (hasConfig("formal_version") && Boolean.parseBoolean(config.formal_version)) {
        def buildTxt = configFile.toPath()
        List<String> lines = Files.readAllLines buildTxt
        lines.replaceAll { String ln ->
            if (ln.startsWith("mod_version")) {
                def version = ln.split("=")[1]
                def dot = version.lastIndexOf('.') + 1
                def newVersion = version.substring(0, dot)
                def lastOne = Integer.parseInt(version.substring(dot)) + 1
                return "mod_version=" + newVersion + lastOne
            }
            return ln
        }
        Files.write buildTxt, lines, java.nio.file.StandardOpenOption.CREATE
    }
}

tasks.register("incrementBuildVersionProperty") {
    group "upload"
    doLast incrementBuild
}
tasks.build.dependsOn tasks.incrementBuildVersionProperty

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
