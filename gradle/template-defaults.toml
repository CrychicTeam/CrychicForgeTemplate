# Keep this branch-specific defaults file intentionally curated. Project-level
# extras belong in project.toml via [repositories] and [dependencies.*].
defaults_revision = "forge-1.19.2-r1"

[platform]
loader = "forge"
publish_loader = "Forge"
mc_version = "1.19.2"
mc_range = "[1.19.2,1.20)"
loader_version = "43.5.2"
loader_version_range = "[43,)"
forge_version = "43.5.2"
forge_range = "[43,)"
java = "17"
mixin_extras_group = "com.github.llamalad7.mixinextras"
parchment_mappings = "2022.11.27"
game_test_namespace_property = "forge.enabledGameTestNamespaces"
supported_dev_packs = ["basic", "appleskin", "combat", "curios", "spell", "kubejs"]

[versions]
registrate = "MC1.19-1.1.5"
kotlin = "2.1.20"
kubejs_forge = "1902.6.2-build.74"
jei = "11.8.1.1034"
curios = "1.19.2-5.1.6.4"
geckolib = "3.1.40"
player_animator = "1.0.2"
bendylib = "4.0.0"
mixin_extras = "0.2.2"

[builtin_repositories.blamejared]
name = "Jared's Maven"
url = "https://maven.blamejared.com/"
group_regexes = ["mezz\\.jei.*"]

[builtin_repositories.tterrag]
name = "tterrag"
url = "https://maven.tterrag.com/"

[builtin_repositories.sponge]
name = "sponge"
url = "https://repo.spongepowered.org/maven"
groups = ["com.github.llamalad7.mixinextras"]

[builtin_repositories.geckolib]
name = "GeckoLib"
url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
groups = ["com.eliotlash.mclib"]
group_regexes = ["software\\.bernie.*"]

[builtin_repositories.curios]
name = "Curios"
url = "https://maven.theillusivec4.top/"
groups = ["top.theillusivec4.curios"]

[builtin_repositories.kosmx]
name = "KosmX's Maven"
url = "https://maven.kosmx.dev/"

[builtin_repositories.cursemaven]
name = "CurseMaven"
url = "https://cursemaven.com"
groups = ["curse.maven"]

[builtin_repositories.architectury]
name = "Architectury"
url = "https://maven.architectury.dev"
groups = ["dev.architectury"]

[builtin_repositories.latvian]
name = "Lat's Maven"
url = "https://maven.latvian.dev/releases"
groups = ["dev.latvian.mods", "dev.latvian.apps"]

[builtin_repositories.jitpack]
name = "JitPack"
url = "https://jitpack.io"
groups = ["com.github.rtyley", "com.github.llamalad7.mixinextras"]

[builtin_dependencies.deobf_api]
registrate = "com.tterrag.registrate:Registrate:{registrate}"

[feature_support.jei.dependencies.deobf_compile_only]
jei_common_api = "mezz.jei:jei-{mc_version}-common-api:{jei}"
jei_loader_api = "mezz.jei:jei-{mc_version}-{jei_loader}-api:{jei}"

[feature_support.jei.dependencies.deobf_runtime_only]
jei_runtime = "mezz.jei:jei-{mc_version}-{jei_loader}:{jei}"

[feature_support.curios.dependencies.deobf_compile_only]
curios = "top.theillusivec4.curios:curios-{curios_loader}:{curios}"

[feature_support.geckolib.dependencies.deobf_implementation]
geckolib = "software.bernie.geckolib:geckolib-forge-1.19:{geckolib}"

[feature_support.geckolib.dependencies.implementation]
mclib = "com.eliotlash.mclib:mclib:20"

[feature_support.geckolib.dependencies.additional_runtime_classpath]
mclib_runtime = "com.eliotlash.mclib:mclib:20"

[feature_support.player_animator.dependencies.deobf_implementation]
player_animator = "dev.kosmx.player-anim:player-animation-lib-{player_animator_loader}:{player_animator}"

[feature_support.player_animator.dependencies.deobf_runtime_only]
bendylib = "io.github.kosmx.bendy-lib:bendy-lib-{bendylib_loader}:{bendylib}"

[feature_support.mixin_extras.dependencies.compile_only]
mixinextras_common = "{mixin_extras_group}:mixinextras-common:{mixin_extras}"

[feature_support.mixin_extras.dependencies.annotation_processor]
mixinextras_common_processor = "{mixin_extras_group}:mixinextras-common:{mixin_extras}"

[feature_support.mixin_extras.dependencies.deobf_implementation]
mixinextras_loader = "{mixin_extras_group}:mixinextras-{mixin_extras_loader}:{mixin_extras}"

[dev_packs.basic]
description = "Basic local HUD and inspection helpers."

[dev_packs.basic.dependencies.deobf_runtime_only]
jei = "mezz.jei:jei-1.19.2-forge:11.8.1.1034"
jade = "curse.maven:jade-324717:4914105"

[dev_packs.appleskin]
description = "AppleSkin as a standalone local HUD helper."

[dev_packs.appleskin.dependencies.deobf_runtime_only]
appleskin = "curse.maven:appleskin-248787:3872808"

[dev_packs.combat]
description = "Combat-debug helpers: target dummy and common attribute fixes."

[dev_packs.combat.dependencies.deobf_runtime_only]
target_dummy = "curse.maven:mmmmmmmmmmmm-225738:4410143"
attribute_fix = "curse.maven:attributefix-280510:4635476"
max_health_fix = "curse.maven:max-health-fix-492246:4658481"

[dev_packs.curios]
description = "Curios local runtime for slot and accessory integration testing."

[dev_packs.curios.dependencies.deobf_runtime_only]
curios = "top.theillusivec4.curios:curios-forge:1.19.2-5.1.6.4"

[dev_packs.spell]
description = "Spell-system smoke test helpers."

[dev_packs.spell.repositories]
redspace = "https://code.redspace.io/releases"

[dev_packs.spell.dependencies.deobf_runtime_only]
caelus = "curse.maven:caelus-308989:3929284"
irons_spellbooks = "io.redspace.ironsspellbooks:irons_spellbooks:1.19.2-3.4.0"

[dev_packs.kubejs]
description = "KubeJS local runtime for script-driven smoke tests."

[dev_packs.kubejs.dependencies.deobf_runtime_only]
architectury = "dev.architectury:architectury-forge:6.5.90"
rhino = "dev.latvian.mods:rhino-forge:1902.2.3-build.284"
kubejs = "dev.latvian.mods:kubejs-forge:1902.6.2-build.74"
