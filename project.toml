schema_version = 1
template_version = "1.18.2-template-1.0.0"

[mod]
mod_id = "example"
mod_name = "example"
version = "0.0.1"
version_suffix = ""
group = "com.mihono.pickaid"
authors = ["example"]
license = "MIT"
description = "Pexample.\nexample line."
credits = "None"
issue_tracker_url = "https://github.com/org/repo/issues"

[features]
jei = false
curios = false
geckolib = false
player_animator = false
mixin_extras = true

[languages]
# Java is always enabled. Kotlin is opt-in and can be mixed with Java.
kotlin = false

[dev_packs]
# Local-only helper packs for development runs.
# They are for easier local testing and do not define your published API surface.

# JEI + Jade for quick recipe lookup and in-world inspection during development.
basic = false
# AppleSkin on its own when you only want hunger and saturation HUD help.
appleskin = false
# Target Dummy + AttributeFix + Max Health Fix for combat balancing checks.
combat = false
# Curios runtime when you need accessory slot behavior in local runs.
curios = false
# Caelus + Iron's Spellbooks for spell and attribute smoke testing.
spell = false
# KubeJS + Rhino + Architectury for local script-driven testing.
kubejs = false

[overrides]
# Only override curated versions when an enabled built-in feature needs a
# different version than the template default.
# jei_version = "10.2.1.1009"
# curios_version = "1.18.2-5.0.9.2"
# geckolib_version = "3.0.57"
# player_animator_version = "1.0.2+1.18"
# bendylib_version = "4.0.0"
# mixin_extras_version = "0.2.2"

[repositories]
# These common repositories are already filled in for you.
# Most projects can leave this block alone and only add extra entries when a
# mod or library lives somewhere else.
# You can also use the inline-table form when you want a clearer display name
# or a content filter for specific groups:
# custom_spell_repo = { url = "https://code.redspace.io/releases", name = "Redspace", groups = ["io.redspace.ironsspellbooks"], group_regexes = ["io\\.redspace\\..*"] }
blamejared = "https://maven.blamejared.com/"
tterrag = "https://maven.tterrag.com/"
sponge = "https://repo.spongepowered.org/maven"
geckolib = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
curios = "https://maven.theillusivec4.top/"
kosmx = "https://maven.kosmx.dev/"
cursemaven = "https://cursemaven.com"
architectury = "https://maven.architectury.dev"
latvian = "https://maven.latvian.dev/releases"
jitpack = "https://jitpack.io"

[dependencies]
# Use nested tables by Gradle-style bucket name.
# Buckets ending in _api are for libraries you expose to downstream compile
# consumers. deobf_* buckets are for mod dependencies that need remapping.
# Example:
# [dependencies.deobf_api]
# registrate_api = "com.tterrag.registrate:Registrate:MC1.18.2-1.1.3"
#
# [dependencies.deobf_compile_only]
# kubejs = "curse.maven:kubejs-238086:4377177"
#
# [dependencies.deobf_implementation]
# architectury = { notation = "dev.architectury:architectury-forge:4.12.94", transitive = false }
#
# Advanced native import example. Only prebuilt JNI/JNA binaries are packaged;
# the template does not compile Rust/C/C++ sources.
# Files go under native-libs/<library>/<platform>/<fileName>.
# [native_libraries.physics]
# load_name = "pickaid_physics"
# loader = "jni"
# platforms = ["windows-x86_64", "linux-x86_64", "macos-aarch64"]
# required = true
#
# [dependencies.deobf_compile_only_api]
# curios_api = "top.theillusivec4.curios:curios-forge:1.18.2-5.0.9.2"
#
# [dependencies.jarjar]
# helper = { notation = "com.example:helper-forge:1.0.0", range = "[1.0.0,)" }
#
# The common ecosystem entries below are already filled out for reference.
# Leave them commented if you are using [features] or [dev_packs].
# Uncomment them when you want to control these dependencies manually.
#
# Base API surface example:
# [dependencies.deobf_api]
# registrate = "com.tterrag.registrate:Registrate:MC1.18.2-1.1.3"
#
# Common feature-style examples:
# [dependencies.deobf_compile_only]
# jei_common_api = "mezz.jei:jei-1.18.2-common-api:10.2.1.1009"
# jei_forge_api = "mezz.jei:jei-1.18.2-forge-api:10.2.1.1009"
# curios = "top.theillusivec4.curios:curios-forge:1.18.2-5.0.9.2"
#
# [dependencies.deobf_runtime_only]
# jei_runtime = "mezz.jei:jei-1.18.2-forge:10.2.1.1009"
# bendylib = "io.github.kosmx.bendy-lib:bendy-lib-forge:4.0.0"
#
# [dependencies.deobf_implementation]
# geckolib = "software.bernie.geckolib:geckolib-forge-1.18:3.0.57"
# player_animator = "dev.kosmx.player-anim:player-animation-lib-forge:1.0.2+1.18"
# mixinextras_forge = "com.github.llamalad7.mixinextras:mixinextras-forge:0.2.2"
#
# [dependencies.compile_only]
# mixinextras_common = "com.github.llamalad7.mixinextras:mixinextras-common:0.2.2"
#
# [dependencies.annotation_processor]
# mixinextras_common_processor = "com.github.llamalad7.mixinextras:mixinextras-common:0.2.2"
#
# Typical extra ecosystem examples:
# [dependencies.deobf_compile_only]
# kubejs = "curse.maven:kubejs-238086:4377177"
# rhino = "curse.maven:rhino-416294:4069880"
#
# [dependencies.deobf_implementation]
# architectury = { notation = "dev.architectury:architectury-forge:4.12.94", transitive = false }

# Built-in local dev packs can be toggled in [dev_packs].
# basic: JEI + Jade
# appleskin: AppleSkin only
# combat: Target Dummy + AttributeFix + Max Health Fix
# curios: Curios runtime
# spell: Caelus + Iron's Spellbooks
# kubejs: Architectury + Rhino + KubeJS runtime

[compat]
# Optional legacy compatibility keys for projects that still have custom
# build.gradle logic reading config.<name> values directly.
# Keep these minimal and migrate them away when the project no longer needs
# the old keys.
# reference_projects = false
# kubejs_version = "1802.5.5-build.569"
# rhino_version = "1802.2.1-build.255"

[publish]
# Leave blank for local-only publishing. MAVEN_URL can override this in CI.
maven_url = "https://maven.mihono.cn/repository/pickaid1182/"
# Local machine settings should normally go in project.local.toml instead:
# - [run].mc_user
# - [publish].maven_user / maven_password / modrinth_token / curseforge_token
# See project.local.toml.example.
#
# Temporary fallbacks are still accepted here, but prefer env vars or
# project.local.toml and do not commit filled-in secrets.
# CurseForge upload tokens are generated from the API Tokens page:
# https://support.curseforge.com/support/solutions/articles/9000197321-curseforge-api
# Direct page:
# https://authors-old.curseforge.com/account/api-tokens
# Modrinth PATs are generated from user settings:
# https://docs.modrinth.com/api/
# Settings entry:
# https://modrinth.com/settings/account
# maven_user = ""
# maven_password = ""
# modrinth_token = ""
# curseforge_token = ""
curseforge_project = 0
modrinth_project = ""
# Prefer MAVEN_USER / MAVEN_PASSWORD from the environment. The TOML fallback
# above is only for temporary local use.
# release_type: alpha, beta, release
release_type = "alpha"

[naming]
archive_name = "example"
jar_format = "{archive_name}-{mc_version}-{version}"
